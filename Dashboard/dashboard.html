    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <body>
        <div class="sidebar">
            <div class="logo"></div>
                <ul class="main-menu">
                    <li class="active">

                    </li>
                      <li>
                       <a href="#">
                        <i class="fa-solid fa-user-plus"></i>

                    </li>
                      <li>

                    </li>
                      <li>
                       <a href="#">

                      <li class="logout">
