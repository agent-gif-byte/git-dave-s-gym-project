<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="sign-up.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Sign-up</title>
</head>
    <body>
        <div class="container">
                 <h1 style="text-align: center; color: rgb(255, 255, 255);">Sign Up</h1>
            <form action="../login/login.html">
                <div class="input">
                    <input class="inp" type="text" placeholder="Name" required>
                    <input class="inp" type="email" placeholder="Email" required>
                    <input class="inp" type="password" placeholder="password" required>

                    <button class="btn"> Sign up</button>
                </div>
                <div class="link">
                    <p>Already have an account?</p>
                    <a href="../login/login.html"> log in</a>
                    
                    
                </div>
                    <div class="line">
                        <hr> <p>or</p><hr>
                    </div>

                    <div class="direct">
                        <a href="https://myaccount.google.com/?pli=1">
                            <i class="fa-brands fa-google"></i>
                            <span style="margin-left: 10px;"> Sign up with Google</span>
                        </a>
                    </div>

            </form>    
        </div>
    </body> 
</html>
